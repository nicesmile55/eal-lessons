<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="eal-page" content="notice"><meta name="robots" content="noindex"><title>Lesson 5</title><style>:root{--bg:#fbfaf7;--card:#ffffff;--ink:#1d2330;--line:#dde1e8;--accent:#0b6e4f;--onaccent:#ffffff;--bad:#b91c1c}@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--ink:#e8eaee;--line:#333a45;--accent:#34d399;--onaccent:#0b1a14;--bad:#f87171}}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 Verdana,Arial,sans-serif}main{max-width:440px;margin:0 auto;padding:40px 16px}.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}h1{font-size:22px;margin:0 0 12px}label{display:block}input[type=text]{width:100%;font:inherit;font-size:22px;padding:10px;border:2px solid var(--accent);border-radius:8px;background:var(--card);color:var(--ink);margin:8px 0 12px}.rem{display:flex;align-items:center;gap:10px;min-height:44px;margin:0 0 12px}.rem input{width:22px;height:22px}button{font:inherit;min-height:44px;width:100%;border:0;border-radius:8px;background:var(--accent);color:var(--onaccent);cursor:pointer}.err{color:var(--bad);font-weight:700;min-height:1.6em;margin:8px 0 0}a{color:var(--accent)}.hidden{display:none!important}.spin{height:100%;display:flex;align-items:center;justify-content:center}.spin div{width:2rem;height:2rem;border:.25em solid gray;border-right-color:transparent;border-radius:50%;animation:s .75s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin div{animation:none}}</style></head><body><main><div class="box"><h1>Lesson 5</h1><p>Lesson 5 opens after Mr Vang teaches it in class. Scan this code again after that class.</p><p><a href="../">See the open lessons</a></p></div></main></body></html>
