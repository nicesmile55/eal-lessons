    document.getElementById("lock-notice-title").textContent = "Lesson " + n;
    document.getElementById("lock-notice-text").textContent = "Lesson {n} opens after Mr Vang teaches it in class. Scan this code again after that class.".replace("{n}", n);
    document.getElementById("lock-see").href = see;
    showBox("lock-notice");
};
window.onload = async function () {
    if (LESSON) {
        document.getElementById("lock-list").classList.remove("hidden");
        let open = 0;
        try {
            const r = await fetch("../release.json", {cache: "no-store"});
            open = r.ok ? Math.floor(+(await r.json()).open) || 0 : 0;
        } catch (e) {open = 0}
        if (open >= 1 && LESSON > open) {showNotice(LESSON, "../"); return}
    }
    const m = /^#lesson-(\d+)$/.exec(location.hash || "");
    if (m && OPEN_LESSONS.length && !OPEN_LESSONS.includes(+m[1])) {
        showNotice(m[1], location.pathname + location.search);
        return;
    }
    let opened = false;
    try {opened = (await staticrypt.handleDecryptOnLoad()).isSuccessful} catch (e) {opened = false}
    if (!opened) {showBox("staticrypt_content"); document.getElementById("staticrypt-password").focus()}
};
document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const word = document.getElementById("staticrypt-password").value.trim().toLowerCase(),
        remember = document.getElementById("staticrypt-remember").checked, err = document.getElementById("lock-error");
    err.textContent = "";
    if (!word) {err.textContent = "Type the word first."; return}
    const {isSuccessful} = await staticrypt.handleDecryptionOfPage(word, remember);
    if (!isSuccessful) err.textContent = "Not yet. Check the word and try again.";
});
</script>
