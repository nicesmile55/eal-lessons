    if (!opened) {showBox("staticrypt_content"); document.getElementById("staticrypt-password").focus()}
};
document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const word = document.getElementById("staticrypt-password").value.trim().toLowerCase(),
        remember = document.getElementById("staticrypt-remember").checked, err = document.getElementById("lock-error");
    err.textContent = "";
    if (!word) {err.textContent = "Type the word first."; return}
    const {isSuccessful} = await staticrypt.handleDecryptionOfPage(word, remember);
    if (!isSuccessful) err.textContent = "Not yet. Check the word and try again.";
});
</script>
